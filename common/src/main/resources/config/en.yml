# SourbyAntiCheat main configuration
# Source code: https://github.com/YanIanZ/SourbyAntiCheat
# Copyright 2026 YanIanZ, Licensed under GPLv3.
# Modified binaries, or plugins with copied sac code, must be private,
# or with full source code available to buyers at no additional cost.

alerts:
    # In addition to broadcasting alerts to players, should they also be sent to the console?
    print-to-console: true
    # This controls whether/how alerts are shared between servers connected to your proxy.
    # You must have 'bungee-plugin-message-channel' enabled in your Velocity's configuration if Velocity is in use.
    proxy:
        # Should alerts be sent to other servers connected to your proxy?
        send: false
        # Should the alerts received from other servers be announced to this server?
        receive: false

verbose:
    print-to-console: false

check-for-updates: true

client-brand:
    # This means it won't broadcast their brand to operators if the brand matches the following regexes
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^quilt$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"
        - "^Feather Fabric$"
        - "^labymod$"
    # SAC will blacklist specific Forge versions which include built-in Reach hacks (Forge 1.18.2 to 1.19.3).
    # Setting this option to false will allow said clients to connect to the server. Disable this at your own risk.
    disconnect-blacklisted-forge-versions: true

spectators:
    # Hide all spectators with the sac.spectator permission regardless if they are actually actively spectating
    hide-regardless: false
    # Will make spectators hidden only in these worlds, keep blank to allow all worlds
    allowed-worlds:
        - ""

# How long should players have until we kick them for timing out? Default = 60 seconds
max-transaction-time: 60

# Enable this to stop SAC cancelling pongs received from players.
# This may improve compatibility with other anticheats. It may cause issues with packet limiters.
# Do not enable this if you are not sure what you are doing.
disable-pong-cancelling: false

# Should the default block resynchronization handler be disabled?
# By default, SAC reads blocks from the server world and sends them to the client to fix desync.
# If you use plugins that create fake packet-based blocks (which don't exist in the server world),
# you should set this to true to prevent SAC from overwriting them with air/real blocks.
# This forces the use of a "NoOp" (No Operation) handler unless a custom one is provided via API.
disable-default-resync-handler: false

# Should the duplicate movement packet be cancelled?
# Mojang has fixed this issue in 1.21. This was their attempt to fix the "bucket desync". https://bugs.mojang.com/browse/MC-12363
# This setting only applies to 1.17-1.20.5 clients on 1.8 servers.
cancel-duplicate-packet: true

# Whether or not to ignore the rotation in duplicate packets
ignore-duplicate-packet-rotation: false

Simulation:
    # How much should we multiply total advantage by when the player is legit
    # This is what the default config looks like (x axis = seconds, y axis = 1/1000 block): https://www.desmos.com/calculator/d4ufgxrxer
    setback-decay-multiplier: 0.999
    # How large of an offset from the player's movement should we create a violation for?
    # Measured in blocks from the possible movement
    # We account for Optifine by switching trig tables but dropping this to 0.001 will reduce FastMath
    # flagging the anticheat if this compensation doesn't work...
    threshold: 0.001
    # How large of a violation in a tick before the player gets immediately setback?
    # -1 to disable
    immediate-setback-threshold: 0.1
    # How large of an advantage over all ticks before we start to setback?
    # -1 to disable
    max-advantage: 1
    # After 50 seconds with default config, the player will go from 4 blocks -> 1 block of advantage
    # This is to stop the player from gathering too many violations and never being able to clear them all
    # Default advantage ceiling (x axis = seconds, y axis = 1/1000 block): https://www.desmos.com/calculator/4lovswdarj
    max-ceiling: 4
    # Violation level threshold for setback
    # 1 for old behavior
    setback-violation-threshold: 1

# Checks to see if a player entered a block during a movement
Phase:
    setbackvl: 1 # Glitching into blocks can allow wall climbing, plus this check is relatively stable
    decay: 0.005

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 5

FarPlace:
    cancelvl: 5

PositionPlace:
    cancelvl: 5

RotationPlace:
    cancelvl: 5

# Prediction-based no slow check
# SAC accounts for buggy netcode here... hard to false even when spamming right click and offhand button
# Much more stable than other anticheats, but please report any falses... I have fixed a ton of netcode issues here.
NoSlow:
    # How much of an offset is "cheating"
    # By default this is lower than other offs
    # Flags by 0.03-0.2 consistently with NoSlow on
    threshold: 0.001
    # Setback fast on the first item to remove any advantage NoSlow gives
    setbackvl: 5
    # Decay's when the player uses an item AND is slowed by it
    decay: 0.05

Knockback:
    # How much should we multiply total advantage by when the player is legit
    setback-decay-multiplier: 0.999
    # How large of an offset from the player's velocity should we create a violation for?
    # Measured in blocks from the possible velocity
    threshold: 0.001
    # How large of a violation in a tick before the player gets immediately setback?
    # -1 to disable
    immediate-setback-threshold: 0.1
    # How large of an advantage over all ticks before we start to setback?
    # -1 to disable
    max-advantage: 1
    # This is to stop the player from gathering too many violations and never being able to clear them all
    max-ceiling: 4

Explosion:
    threshold: 0.001
    setbackvl: 3

TimerA:
    setbackvl: 10
    # Milliseconds that the player can accumulate for later use when they fall behind
    # Could potentially allow 1.8 fast use/fast heal/fast bow bypasses if set too high, 120 ms seems like a good balance
    drift: 120

# This check limits abuse of the TimerA balance by preventing the player's movement falling too far behind realtime
TimerLimit:
    # Ping at which the check will start to limit timer balance, to prevent abuse.
    # Can cause some setbacks for legitimate players but only if they are over this ping threshold.
    # -1 to disable
    ping-abuse-limit-threshold: 1000

NegativeTimer:
    # Number of milliseconds lost while moving before we should start flagging
    drift: 1200

# Same check method as TimerA, but for vehicles
VehicleTimer:
    # Target 1.005 timer
    setbackvl: 10

PacketOrderI:
    # enable if players are getting flagged for using 1.7 animations mods
    exempt-placing-while-digging: false

Reach:
    # How much should we expand hitboxes by? 0.001 should detect 3.001+ reach.
    # Raised from 0.0005 to avoid false positives on sub-pixel interpolation noise.
    #
    # There is 0.03 forced expansion with 1.9-1.18.1 (not 1.18.2), or some client/server combinations due to
    # protocol changes and limitations. This check is most powerful with 1.7/1.8 clients on 1.8 servers.
    threshold: 0.001
    # Should we cancel hits that we know are impossible?
    # 3.00-3.03 hits may go through but still be flagged, due to packet order limitations
    block-impossible-hits: true
    # This will send an additional packet at the end of every tick to increase the likelihood of catching cheats
    # This injects into server's connection list to send a final packet just before the server flushes
    # Enabling this will increase bandwidth usage for all players
    # This will not decrease overall server performance
    # Enabling this will catch more cheaters.
    # Leaving this disabled will still catch cheaters and will not cause false positives
    # Unless you are a 1.8 PvP focused server, this additional packet is not recommended
    enable-post-packet: false

exploit:
    # You can gain high speeds when sprint jumping with an elytra, this prevents the exploit when set to false
    # Mojang screwed up netcode by making elytra start client sided and elytra end server sided
    # Elytras take 0.99 horizontal friction, so constantly adding 0.2 horizontal speeds results in very high speeds.
    allow-sprint-jumping-when-using-elytra: true
    # This option mitigates the player's placement on ghostblocks by resynchronizing the player when it happens
    allow-building-on-ghostblocks: true
    # This setting, influenced by the boolean above defines the distance to check for ghost blocks
    # Its valid range is limited from 2 to 4
    distance-to-check-if-ghostblocks: 2

# Enable logging plugins who have injected into netty on join to debug compatibility issues
debug-pipeline-on-join: false

# Enables experimental checks
# Enables experimental checks globally (may have false positives)
# Set to false for production, true for testing

# --- Netty Layer 1 Packet Inspection ---
netty:
    # Should SAC inject a Netty channel handler for raw packet timing analysis?
    # Disable if you experience connection issues with other Netty-injecting plugins.
    # If injection fails, SAC falls back to PacketEvents-only mode automatically.
    inject: true

# --- SpartanAPI Cross-Check ---
spartanapi:
    # Should SAC cross-check violations with Spartan AntiCheat via SpartanAPI?
    # When both SAC and Spartan flag the same player/check, alerts are tagged [SAC+Spartan].
    # Requires Spartan (Spartan) to be installed. If absent, this setting is ignored.
    cross-check: true
    # Minimum SAC violations before querying Spartan (reduces overhead)
    min-vl: 3
    # Confidence multiplier when both SAC and Spartan agree (1.0 = normal)
    agreement-multiplier: 1.5

# --- New SAC Checks ---
AutoClicker:
    setbackvl: 10
    decay: 0.025
    # Number of recent clicks sampled for CPS/variance analysis
    window-size: 20
    # CPS above which clicking is considered impossible for a human
    max-legit-cps: 30
    # Minimum click-interval variance below which clicking looks automated
    min-variance: 2
    # CPS above which a violation is flagged
    cps-flag-threshold: 18
    # Age (ms) above which buffered click samples are discarded
    cleanup-window-ms: 1000

AimAssist:
    setbackvl: 5
    decay: 0.01

Speed:
    setbackvl: 10
    decay: 0.01

FlightA:
    setbackvl: 10
    decay: 0.02

# --- Logging Configuration ---
logs:
    violation:
        # Format: JSON for structured logging, TEXT for human-readable
        format: JSON
        # How many days to keep violation logs (-1 = forever)
        retention-days: 30
    audit:
        # Enable append-only audit logging for staff actions
        enabled: true
    # Discord webhook for violation alerts (configured in discord.yml)
    webhook:
        enabled: false

# --- Auto-Punishment ---
punishment:
    # Warn player in chat when total VL exceeds this threshold
    warn-threshold: 100
    warn-message: "&c[SAC] You have been flagged for cheating. VL=%vl%"
    # Kick player when total VL exceeds (requires kick-command)
    kick-threshold: 150
    kick-command: ""
    # Execute command when total VL exceeds (e.g. ban)
    ban-threshold: 200
    ban-command: ""
    # Wave punishment: queue bans and execute in batches
    # Prevents cheat devs from knowing which check triggered the ban
    wave-command: ""
    wave-interval: 60

# --- Global Check Control ---
# Disable specific checks server-wide by setting to false
# All checks are enabled by default
checks:
    enabled:
        AutoClicker: true
        AimAssist: true
        AimSuspicion: true
        AutoArmor: true
        Blink: true
        SafeWalk: true
        Speed: true
        FlightA: true
        BadPacketsAE: true
        BadPacketsW: true
        NettyDelay: true
        NettyFlood: true

NettyFlood:
    setbackvl: 15
    decay: 0.01

SpartanSync:
    setbackvl: 20
    decay: 0.005

PayloadCheck:
    setbackvl: 10
    decay: 0.01

BadPacketsAA:
    setbackvl: 10
    decay: 0.005

BadPacketsAB:
    setbackvl: 10
    decay: 0.005

BadPacketsAC:
    setbackvl: 10
    decay: 0.005

NettyDelay:
    setbackvl: 15
    decay: 0.02

SpartanDivergence:
    setbackvl: 25
    decay: 0.01

APIBypass:
    setbackvl: 0
    decay: 0.001

Spider:
    setbackvl: 10
    decay: 0.02

Jesus:
    setbackvl: 10
    decay: 0.02

FastLadder:
    setbackvl: 10
    decay: 0.02

NoWeb:
    setbackvl: 10
    decay: 0.02

Step:
    setbackvl: 10
    decay: 0.02

EntitySpeed:
    setbackvl: 10
    decay: 0.02

SafeWalk:
    setbackvl: 5
    decay: 0.02

Blink:
    setbackvl: 15
    decay: 0.02

ScaffoldA:
    setbackvl: 10
    decay: 0.02

ScaffoldB:
    setbackvl: 10
    decay: 0.02

Criticals:
    setbackvl: 5
    decay: 0.02
    # Buffer count at which a critical-hit violation is flagged
    flag-threshold: 5
    # Vertical delta below which a "fake critical" is detected
    delta-y-threshold: 0.01

FastBow:
    setbackvl: 5
    decay: 0.02
    # Minimum bow charge time (ms) before a shot is considered legitimate
    min-charge-time: 120
    # Buffer count at which a fast-bow violation is flagged
    flag-threshold: 3

FastEat:
    setbackvl: 5
    decay: 0.02
    # Minimum eat time (ms) before consumption is considered legitimate
    min-eat-time: 1400
    # Minimum drink time (ms) before consumption is considered legitimate
    min-drink-time: 1400
    # Buffer count at which a fast-eat violation is flagged
    flag-threshold: 3
    # Minimum buffer count below which clean behaviour resets the buffer
    min-flag: 1

AutoArmor:
    setbackvl: 5
    decay: 0.02
    # Armor-switch delay (ms) below which a switch is considered automated
    min-switch-delay: 50
    # Number of fast switches counted before flagging
    switch-count-threshold: 10
    # Consecutive fast switches that reset the violation counter
    fast-switch-threshold: 3

FastSwitch:
    setbackvl: 5
    decay: 0.02

BadPacketsAD:
    setbackvl: 5
    decay: 0.01

BadPacketsAE:
    setbackvl: 5
    decay: 0.01

BadPacketsAF:
    setbackvl: 10
    decay: 0.005

AimSnap:
    # Number of recent rotation packets retained for snap-back analysis
    max-snap-back-packets: 3
    # Rotation delta (degrees) above which a snap is detected
    snap-threshold: 30.0
    # Rotation delta (degrees) below which a return-to-target is detected
    return-threshold: 25.0
    # Difference (degrees) between snap and return used to confirm aim snap
    diff-threshold: 15.0
    # Buffer count at which an aim-snap violation is flagged
    buffer-threshold: 3

AimSuspicion:
    # Fraction of attack ticks with suspicious rotation above which it is flagged
    ratio-threshold: 0.95
    # Minimum number of attack ticks sampled before the ratio is evaluated
    total-attack-ticks-min: 15
    # Buffer count at which an aim-suspicion violation is flagged
    buffer-threshold: 3

AttackFrequency:
    # Minimum interval (ms) between attacks before timing looks automated
    min-attack-interval: 25
    # Number of rapid attacks counted before flagging
    rapid-attacks-threshold: 5
    # Attacks per tick above which a violation is flagged
    attacks-per-tick-threshold: 4
    # Buffer count at which an attack-frequency violation is flagged
    buffer-threshold: 2

AntiVelocity:
    # Ticks after a velocity packet during which knockback response is checked
    velocity-response-ticks: 5
    # Minimum velocity magnitude below which knockback is ignored
    min-velocity: 0.1
    # Ground friction coefficient used for velocity prediction
    ground-friction: 0.91
    # Air friction coefficient used for velocity prediction
    air-friction: 0.98
    # Average velocity ratio below which anti-knockback is flagged
    avg-ratio-threshold: 0.1
    # Buffer count at which an anti-velocity violation is flagged
    buffer-threshold: 2

NoSwing:
    # Window (ms) within which a swing must precede an attack
    swing-window: 50
    # Buffer count at which a no-swing violation is flagged
    flag-threshold: 3
    # Minimum buffer count below which clean behaviour resets the buffer
    min-flag: 2

reset-item-usage-on-item-update: true
reset-item-usage-on-attack: true
reset-item-usage-on-slot-change: true
reset-item-usage-on-item-use: true

# SAC sometimes cancels illegal packets such as with timer, after X packets in a second cancelled, when should
# we simply kick the player? This is required as some packet limiters don't count packets cancelled by sac.
packet-spam-threshold: 100
# Enable this to print a stacktrace when a player is kicked due to packet-spam-threshold
debug-packet-cancel: false

# SAC is able to enforce that a player set out of flying state cannot have more than X milliseconds of ping
# This is due to SAC not currently checking flying players
# To disable, use -1
max-ping-out-of-flying: 1000

# Maximum ping when a firework boost is removed from the player.
# This prevents high latency players from being able to use 1 firework boost with an elytra forever.
max-ping-firework-boost: 1000

# Schema markers — touch only if you know what you're doing.
#   config-flavor:  V2 = SAC 2.x build, V3 = SAC 3.x. The plugin refuses
#                   to load a config whose flavor doesn't match its own
#                   build, so a V3 config opened by a V2 jar fails fast
#                   instead of silently flat-merging into the wrong keys.
#   config-version: bumped on every breaking shape change. Old configs
#                   auto-migrate up via the bundled updater on next start.
config-flavor: V2
config-version: 10

# SpartanAPI configuration
spartanapi:
  enabled: true
  bundle-mode: standalone
  cross-check:
    enabled: true
    min-vl: 3
    min-agreement-rate: 0.6
  event-bridge:
    enabled: true
    deduplication-window-ms: 500

# ============================================================================
# CrossAPI check tuning
# ----------------------------------------------------------------------------
# Tunables for the CrossAPI (cross-anticheat correlation) checks. Every value
# below is the built-in default — keys are optional, omit one to keep the
# default. Each block is named after the check's config name; raising a
# threshold makes the check more lenient, lowering it makes it stricter.
# ============================================================================

crossautoclicker:
    # Netty packet-timing variance below which clicking looks too consistent (bot-like)
    netty-variance-threshold: 10.0
    # Netty packet rate above which clicking is considered suspicious
    netty-rate-threshold: 15.0
    # Max clicks-per-second allowed for low-ping players
    cps-threshold-low-ping: 18
    # Max clicks-per-second allowed for medium-ping players
    cps-threshold-med-ping: 15
    # Max clicks-per-second allowed for high-ping players
    cps-threshold-high-ping: 12
    # Max clicks-per-second allowed for very-high-ping players
    cps-threshold-very-high-ping: 10

crosselytramove:
    # Max horizontal elytra speed (blocks/s) before flagging
    speed-threshold: 30.0

crossentityspeed:
    # Max speed for a ridden pig
    max-speed-pig: 0.35
    # Max speed for a ridden horse
    max-speed-horse: 0.35
    # Max speed for a ridden strider
    max-speed-strider: 0.35
    # Max speed for a ridden boat
    max-speed-boat: 0.35
    # Max speed for a ridden minecart
    max-speed-minecart: 0.35
    # Max speed for any other ridden entity
    max-speed-default: 0.35

crossfastbow:
    # Minimum bow charge time in milliseconds before a shot is legitimate
    min-charge-time: 100

crossfastbreak:
    # Max blocks broken within the window before flagging
    break-threshold: 8
    # Netty packet rate above which block-breaking is suspicious
    netty-rate-threshold: 18.0

crossfastbreakb:
    # Break-interval variance below which timing looks too consistent (bot-like)
    interval-variance-threshold: 10.0
    # Minimum plausible break interval in milliseconds
    interval-min-ms: 20
    # Maximum break interval in milliseconds still considered for analysis
    interval-max-ms: 200

crossfasteat:
    # Minimum time in milliseconds to finish eating food
    min-eat-time: 1400
    # Minimum time in milliseconds to finish drinking
    min-drink-time: 1400

crossfastladder:
    # Max climbing speed (blocks/tick) on ladders/vines
    max-ladder-speed: 0.20

crossfastplace:
    # Max blocks placed within the window before flagging
    place-threshold: 6
    # Netty packet rate above which block-placing is suspicious
    netty-rate-threshold: 18.0

crossflight:
    # Movement-prediction offset (blocks) above which flight is flagged
    prediction-threshold: 0.15
    # Netty packet rate above which movement is suspicious
    netty-rate-threshold: 18.0

crossfoodsprint:
    # Sprint speed (blocks/tick) allowed while consuming an item
    sprint-speed: 0.28
    # Netty packet rate above which sprinting-while-eating is suspicious
    netty-rate-threshold: 15.0
    # Time in milliseconds after item use within which sprint is checked
    use-timeout-ms: 5000

crossfreecam:
    # Camera/position offset (blocks) above which freecam is flagged
    offset-threshold: 0.8
    # Gap in milliseconds between chunk updates considered suspicious
    chunk-gap-threshold-ms: 1500
    # Netty packet rate above which behaviour is suspicious
    netty-rate-threshold: 15.0
    # Netty packet delay (ms) above which behaviour is suspicious
    netty-delay-threshold: 50.0

crossjesus:
    # Position offset (blocks) above which water-walking is flagged
    offset-threshold: 0.15
    # Netty packet rate above which movement is suspicious
    netty-rate-threshold: 18.0

crossjump:
    # Max jump height in blocks before flagging
    jump-threshold: 1.25

crosskillaura:
    # Max rotation change (degrees) per attack considered human
    rotation-threshold: 30.0
    # Attack interval (ms) below which attacks look too fast/consistent
    attack-interval-threshold: 200.0

crosskillaurab:
    # Rotation-variance threshold (degrees) below which aim looks bot-like
    variance-threshold: 30.0
    # Yaw-change threshold (degrees) used for rotation analysis
    rot-yaw-threshold: 10.0
    # Attack count within the window before flagging
    attack-count-threshold: 25
    # Netty packet-timing variance below which behaviour looks bot-like
    netty-variance-threshold: 15.0
    # Consecutive ticks of sustained suspicious yaw before flagging
    sustained-yaw-ticks: 3

crossnofall:
    # Fall-damage prediction offset (blocks) above which NoFall is flagged
    offset-threshold: 0.06

crossphase:
    # Gap in milliseconds between movement updates considered suspicious
    gap-threshold-ms: 1000
    # Position offset (blocks) above which phasing is flagged
    offset-threshold: 0.1
    # Netty packet rate above which movement is suspicious
    netty-rate-threshold: 15.0

crossphaseb:
    # Netty packet rate above which movement is suspicious
    netty-rate-threshold: 15.0
    # Number of blocks passed through before flagging
    blocks-passed-threshold: 2

crossreach:
    # Extra reach distance (blocks) allowed beyond the legitimate limit
    reach-margin: 0.5
    # Netty packet rate above which combat is suspicious
    netty-rate-threshold: 15.0

crossscaffold:
    # Max blocks placed within the window before flagging
    place-threshold: 5
    # Netty packet rate above which block-placing is suspicious
    netty-rate-threshold: 18.0

crossspeed:
    # Multiplier applied to expected velocity before flagging
    velocity-multiplier: 2.0
    # Ground friction constant used in speed prediction
    ground-friction: 0.6
    # Air friction constant used in speed prediction
    air-friction: 0.91
    # Netty packet rate above which movement is suspicious
    netty-rate-threshold: 18.0

crossspeedb:
    # Netty packet rate above which movement is suspicious
    netty-rate-threshold: 18.0
    # Max allowed deviation from the expected movement ratio
    max-ratio-deviation: 0.3
    # Movement-ratio above which speed is flagged
    ratio-threshold: 1.5

crossspider:
    # Minimum vertical delta (blocks) considered when climbing walls
    min-y-delta: 0.15
    # Maximum vertical delta (blocks) considered when climbing walls
    max-y-delta: 0.5
    # Netty packet rate above which movement is suspicious
    netty-rate-threshold: 18.0

crossstep:
    # Max step-up height in blocks before flagging
    step-threshold: 0.6
    # Netty packet delay (ms) above which movement is suspicious
    netty-delay-threshold: 40.0
    # Netty packet rate above which movement is suspicious
    netty-rate-threshold: 18.0

crossteleport:
    # Max teleport distance (blocks) in a single move before flagging
    teleport-dist-threshold: 8.0
    # Netty packet rate above which movement is suspicious
    netty-rate-threshold: 18.0

crosstimer:
    # Timer balance limit before the check considers action
    balance-limit: 15.0
    # Timer balance above which a violation is flagged
    balance-flag-limit: 8.0
    # Netty packet rate above which timing is suspicious
    netty-rate-threshold: 15.0

crosstower:
    # Max upward (Y) speed while towering before flagging
    tower-y-threshold: 0.3
    # Netty packet rate above which block-placing is suspicious
    netty-rate-threshold: 18.0

crossvehicle:
    # Max horse speed (blocks/tick) before flagging
    max-horse-speed: 0.45
    # Max boat speed (blocks/tick) before flagging
    max-boat-speed: 0.40
    # Netty packet rate above which vehicle movement is suspicious
    netty-rate-threshold: 15.0

autoloot:
    # Item pickups within the window before auto-loot is suspected
    pickup-threshold: 10
    # Netty packet rate above which pickups are considered suspicious
    netty-rate-threshold: 15.0

autorespawn:
    # Min gap (ms) between death and respawn; faster is suspicious
    gap-threshold-ms: 500
    # Netty packet rate above which respawn timing is suspicious
    netty-rate-threshold: 15.0

backtrack:
    # Position-history mismatch (blocks) before flagging backtrack
    mismatch-threshold: 1.5

bedfucker:
    # Bed interactions within the window before flagging
    bed-threshold: 3
    # Netty packet rate above which bed interaction is suspicious
    netty-rate-threshold: 18.0

blockreach:
    # Max block-interaction reach distance (blocks) before flagging
    max-block-reach: 5.5

derphead:
    # Absolute pitch (degrees) above which head rotation is flagged as derp
    pitch-threshold: 89.5

extrainventory:
    # Highest valid inventory slot index; interactions above it are invalid
    max-slot: 45
    # Netty packet rate above which inventory action is suspicious
    netty-rate-threshold: 15.0

fastfall:
    # Excess fall speed offset (blocks/tick) over predicted before flagging
    fall-threshold: 0.15
    # Netty packet rate above which fall movement is suspicious
    netty-rate-threshold: 18.0

fastheal:
    # Healing-item uses within the window before flagging
    heal-threshold: 5
    # Netty packet rate above which healing is suspicious
    netty-rate-threshold: 15.0

fightbot:
    # Combined yaw+pitch aim error below which aim looks bot-perfect
    combined-aim-delta-threshold: 2.0
    # Per-entity rotation delta (yaw) below which rotation looks bot-like
    pe-rotation-delta-yaw-threshold: 5.0
    # Consecutive perfect-aim ticks before flagging
    perfect-aim-streak-threshold: 5

forcefield:
    # Max distinct entities attacked in one tick before flagging
    max-attacks-per-tick: 1

freecam:
    # Chunk-ack timeout (ms) before unacked chunks count toward freecam
    chunk-ack-timeout-ms: 3000
    # Movement offset (blocks) before flagging
    move-threshold: 20.0
    # Velocity offset before flagging
    velocity-threshold: 30.0

ghosthand:
    # Solid blocks between player and target before flagging ghost-hand
    wall-blocks-threshold: 3
    # Max attack distance (blocks) considered for the ray check
    max-attack-distance: 8.0

irregularmovements:
    # Min horizontal speed at which a direction change is evaluated
    direction-change-min-speed: 0.3
    # Direction-change sharpness above which movement is flagged
    direction-change-threshold: 0.95

liquids:
    # Movement offset (blocks) in liquid before flagging
    offset-threshold: 0.15
    # Netty packet rate above which liquid movement is suspicious
    netty-rate-threshold: 18.0

morepackets:
    # Packet rate above which packet count is suspicious
    rate-threshold: 30.0
    # Packet byte rate above which traffic is suspicious
    bytes-threshold: 1024.0
    # Netty packet rate above which traffic is cross-confirmed
    netty-rate-threshold: 15.0

noclip:
    # Consecutive ticks intersecting a block before flagging noclip
    inside-buffer-threshold: 4

nuker:
    # Max blocks broken per second before flagging
    max-breaks-per-sec: 15
    # Avg break-interval (ms) below which breaking looks automated
    avg-interval-threshold: 70.0

pingspoof:
    # Ping samples retained for stability analysis
    ping-sample-size: 10
    # Gap (ms) between ping sources above which spoofing is suspected
    ping-gap-threshold: 200.0
    # Transaction ping (ms) above which spoofing is suspected
    transaction-ping-threshold: 300.0
    # Ping variance below which the connection looks unnaturally stable
    variance-threshold: 0.05
    # Avg ping (ms) above which a too-stable connection is suspicious
    avg-ping-threshold: 200.0

portalinventory:
    # Netty packet rate above which portal inventory action is suspicious
    netty-rate-threshold: 15.0

Blink:
    # Gap (ms) between flying packets above which a blink is counted
    gap-threshold-ms: 500
    # Consecutive blink count before flagging
    blink-count-threshold: 5
    # Blink-count decrement applied on a clean tick
    decrement: 1

EntitySpeed:
    # Max ground speed (blocks/tick) while riding a pig
    max-speed-pig: 0.50
    # Max ground speed (blocks/tick) while riding a horse
    max-speed-horse: 0.50
    # Max ground speed (blocks/tick) while riding a strider
    max-speed-strider: 0.50
    # Max ground speed (blocks/tick) while riding a boat
    max-speed-boat: 0.50
    # Max ground speed (blocks/tick) while riding a minecart
    max-speed-minecart: 0.50
    # Max ground speed (blocks/tick) while riding any other entity
    max-speed-default: 0.50
    # Buffer added when ridden-entity speed exceeds the limit
    buffer-increment: 0.5
    # Buffer decay applied per clean tick
    buffer-decay: 0.01

FastLadder:
    # Max vertical speed (blocks/tick) allowed while climbing a ladder
    max-ladder-speed: 0.20
    # Buffer added when ladder speed exceeds the limit
    buffer-increment: 0.3
    # Buffer decay applied per clean tick
    buffer-decay: 0.01

inventorywalk:
    # Time (ms) the inventory must stay open before movement is judged
    inventory-timeout-ms: 3000
    # Movement distance (blocks) per tick above which walking is flagged
    move-threshold: 0.0316
    # Consecutive flagging ticks before a violation is raised
    buffer-threshold: 6

InventoryMove:
    # Movement distance (blocks) per tick above which inventory move is flagged
    move-threshold: 0.0707

Jesus:
    # Min fraction of predicted movement at which water-walk is evaluated
    frac-min: 0.92
    # Max fraction of predicted movement at which water-walk is evaluated
    frac-max: 0.99
    # Movement offset above which water-walk is flagged
    offset-threshold: 0.005
    # Buffer count required before raising a violation
    buffer-threshold: 8
    # Buffer count at which a violation is flagged
    buffer-flag: 5

NoRotate:
    # Min horizontal speed at which missing rotation is evaluated
    min-speed: 0.3
    # Consecutive ticks without rotation change before flagging
    tick-threshold: 30
    # Buffer count required before raising a violation
    buffer-threshold: 3

NoSlow:
    # Movement offset above which item-use slowdown bypass is flagged
    offset-to-flag: 0.01

NoWeb:
    # Max speed (blocks/tick) allowed inside a cobweb
    max-web-speed: 0.08
    # Secondary speed threshold for cobweb bypass confirmation
    secondary-threshold: 0.15
    # Buffer decay applied per clean tick
    buffer-decay: 0.005
    # Buffer level below which a clean tick rewards the player
    reward-gate-threshold: 0.01

SafeWalk:
    # Movement delta above which edge-walk behaviour is evaluated
    delta-threshold: 0.05
    # Movement offset above which SafeWalk is flagged
    offset-threshold: 0.001
    # Tick window over which edge-walk behaviour is sampled
    tick-window: 10
    # Buffer count required before raising a violation
    buffer-threshold: 2

Speed:
    # Base walking speed (blocks/tick)
    base-speed: 0.217
    # Base sprinting speed (blocks/tick)
    sprint-speed: 0.281
    # Speed offset above which movement is flagged
    offset-threshold: 0.15
    # Buffer decay applied per clean tick
    buffer-decay: 0.01
    # Buffer level at which a violation is flagged
    flag-threshold: 1.0

Spider:
    # Vertical offset (blocks) above which wall-climb is evaluated
    climb-offset: 0.1
    # Consecutive climbing ticks before flagging
    climb-ticks-threshold: 4
    # Climb-tick counter increment per offending tick
    climb-tick-increment: 1

Step:
    # Max vertical step (blocks) allowed in a single tick
    max-step: 0.70
    # Buffer level at which a violation is flagged
    flag-threshold: 5.0
    # Buffer increment applied per offending step
    step-flag-increment: 1.0

Tower:
    # Min upward movement (blocks) counted as a tower jump
    jump-threshold: 0.35
    # Min interval (ms) between legitimate tower jumps
    min-jump-interval-ms: 250
    # Consecutive fast jumps before flagging
    consecutive-jumps-threshold: 4
    # Buffer count required before raising a violation
    buffer-threshold: 2
